<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Norsk Flashcards</title>
<meta name="description" content="Free Norwegian flashcards: verbs, grammar, vocabulary and B1/B2 practice sentences.">
<meta name="theme-color" content="#00205b">
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 22 16' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='22' height='16' fill='%23ba0c2f'/%3E%3Cpath d='M6 0h4v16H6zM0 6h22v4H0z' fill='%23fff'/%3E%3Cpath d='M7 0h2v16H7zM0 7h22v2H0z' fill='%2300205b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --surface:#fff; --ink:#14213d; --muted:#667189; --line:#dde2ec;
  --brand:#00205b; --brand-ink:#fff; --red:#ba0c2f; --green:#12805c;
  --back-bg:#00205b; --back-ink:#f4f6fb; --shadow:0 18px 40px -18px rgba(0,32,91,.35);
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a1020; --surface:#121a2e; --ink:#e8ecf6; --muted:#8f9bb5; --line:#233050;
  --brand:#7f9cff; --brand-ink:#0a1020; --red:#ff7b8f; --green:#47d19f;
  --back-bg:#e8ecf6; --back-ink:#0f1a36; --shadow:0 18px 40px -18px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);
  padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.logo{width:44px;height:32px;border-radius:5px;flex:none;overflow:hidden;box-shadow:0 2px 8px -2px rgba(0,32,91,.45),0 0 0 1px rgba(0,0,0,.08)}
.logo svg{display:block;width:100%;height:100%}
h1{font:600 1.5rem/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--muted);font-size:.85rem}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.row{display:grid;grid-template-columns:1fr 150px;gap:10px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.stats{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .3s}
.bar .k{background:var(--green)} .bar .u{background:var(--red)}
.legend{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.scene{perspective:1400px}
.card{position:relative;height:clamp(250px,42vh,360px);transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer;border-radius:22px}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;padding:46px 26px 26px;display:flex;overflow-y:auto;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--shadow)}
.front{background:var(--surface);border:1px solid var(--line)}
.back{background:var(--back-bg);color:var(--back-ink);transform:rotateY(180deg)}
.face p{margin:auto;font:400 1.55rem/1.35 var(--serif);text-align:center;white-space:pre-line;overflow-wrap:anywhere}
.back p{font-size:1.3rem;text-align:left}
.tag{position:absolute;top:16px;left:22px;font-size:.8rem;font-weight:600;opacity:.6}
.state{position:absolute;top:13px;right:16px;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid currentColor}
.state:empty{display:none}
.state[data-s=known]{color:var(--green)} .state[data-s=unknown]{color:var(--red)}
.back .state[data-s]{color:var(--back-ink)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;min-width:84px;text-align:center}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:500}
button:hover:not(:disabled){border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mark button{padding:13px;font-weight:600;border-width:1.5px}
.unknown{color:var(--red);border-color:var(--red)} .known{background:var(--green);border-color:var(--green);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tools button{background:var(--surface);border-color:var(--line);color:var(--ink);padding:8px 14px;font-size:.9rem}
.tools button:hover:not(:disabled){border-color:var(--muted)}
.tools #speak{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.tools #speak:hover:not(:disabled){border-color:var(--brand);opacity:.9}
.tools [aria-pressed=true]{color:var(--brand);border-color:var(--brand)}
.hint,.voice{text-align:center;color:var(--muted);font-size:.8rem;margin:0}
@media (hover:none){.hint{display:none}}
kbd{font:inherit;font-size:.75rem;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface)}
footer{margin-top:6px;text-align:center;color:var(--muted);font-size:.8rem}
footer a{color:inherit}
@media (max-width:420px){.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
</style>
</head>
<body>
<main class="app">
  <header>
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 22 16" xmlns="http://www.w3.org/2000/svg"><rect width="22" height="16" fill="#ba0c2f"/><path d="M6 0h4v16H6zM0 6h22v4H0z" fill="#fff"/><path d="M7 0h2v16H7zM0 7h22v2H0z" fill="#00205b"/></svg></span>
    <div><h1>Norsk Flashcards</h1><p class="sub">Verbs, grammar and vocabulary for Norwegian learners</p></div>
  </header>

  <label class="sr" for="set" hidden>Flashcard set</label>
  <select id="set" aria-label="Flashcard set"></select>
  <div class="row">
    <input id="search" type="search" placeholder="Search this set" aria-label="Search this set" autocomplete="off">
    <select id="mode" aria-label="Which cards to show">
      <option value="all">All cards</option>
      <option value="unknown">Unknown only</option>
      <option value="new">Not yet seen</option>
    </select>
  </div>

  <section class="stats" aria-label="Progress">
    <div class="bar" role="progressbar" aria-label="Known cards" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
      <i class="k" id="barK"></i><i class="u" id="barU"></i>
    </div>
    <div class="legend"><span><b id="nKnown">0</b> known</span><span><b id="nUnknown">0</b> unknown</span><span><b id="nTotal">0</b> cards</span></div>
  </section>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Press space to flip.">
      <div class="face front"><span class="tag">Question</span><span class="state" data-s></span><p id="q">Loading…</p></div>
      <div class="face back"><span class="tag">Answer</span><span class="state" data-s></span><p id="a"></p></div>
    </div>
  </div>

  <nav class="nav" aria-label="Card navigation">
    <button id="prev">‹ Previous</button>
    <span class="count" id="count">0 / 0</span>
    <button id="next">Next ›</button>
  </nav>

  <div class="mark">
    <button class="unknown" id="unknownBtn">Still learning</button>
    <button class="known" id="knownBtn">I know this</button>
  </div>

  <div class="tools">
    <button id="speak">🔊 Speak</button>
    <button id="shuffle" aria-pressed="false">🔀 Shuffle</button>
    <button id="ordered" hidden>In order</button>
    <button id="reset">Reset progress</button>
  </div>
  <p class="voice" id="voice"></p>
  <p class="hint"><kbd>Space</kbd> flip · <kbd>←</kbd> <kbd>→</kbd> navigate · <kbd>K</kbd> known · <kbd>U</kbd> learning · <kbd>S</kbd> speak · <kbd>/</kbd> search</p>

  <footer>
    Content courtesy of <a href="https://grammatikk.com/" target="_blank" rel="noopener">grammatikk.com</a> ·
    <a href="https://github.com/hclpandv/norsk-flashcard" target="_blank" rel="noopener">Source and issues on GitHub</a>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script>
// Add new YAML files here (file names in the repo root).
const SETS = [
  'flashcards-vokabular.yaml','flashcards-verbal.yaml','flashcards-irregulære-verb.yaml',
  'flashcards-grammatikk.yaml','flashcards-adjectiver.yaml','flashcards-komparasjon.yaml',
  'flashcards-preposisjoner.yaml','flashcards-uttrykk.yaml',
  'flashcards-B1-praksissetninger.yaml','flashcards-B2-praksissetninger.yaml'
];

const $ = id => document.getElementById(id);
const el = {set:$('set'),search:$('search'),mode:$('mode'),card:$('card'),q:$('q'),a:$('a'),count:$('count'),
  prev:$('prev'),next:$('next'),known:$('knownBtn'),unknown:$('unknownBtn'),speak:$('speak'),shuffle:$('shuffle'),
  reset:$('reset'),voice:$('voice'),bar:$('bar'),barK:$('barK'),barU:$('barU'),
  nK:$('nKnown'),nU:$('nUnknown'),nT:$('nTotal')};

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};
const pretty = f => { const s = f.replace(/^flashcards-/,'').replace(/\.yaml$/,'').replace(/-/g,' '); return s[0].toUpperCase()+s.slice(1); };

let file = '', all = [], view = [], idx = 0, flipped = false, shuffled = false, progress = {}, timer;

SETS.forEach(f => el.set.add(new Option(pretty(f), f)));

function shuffleArray(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

async function loadSet(f){
  file = f; store.set('lastSet', f);
  el.q.textContent = 'Loading…'; el.a.textContent = '';
  try {
    const r = await fetch('./' + encodeURIComponent(f));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = jsyaml.load(await r.text());
    if (!Array.isArray(data)) throw new Error('Unexpected file format');
    all = data.filter(c => c && c.question != null && c.answer != null)
              .map(c => ({q:String(c.question).trim(), a:String(c.answer).trim()}));
  } catch (e) {
    console.error(e); all = [];
    el.q.textContent = 'Could not load this set. Check your connection and try again.';
  }
  try { progress = JSON.parse(store.get('nf2-progress-' + f) || '{}'); } catch { progress = {}; }
  applyView(store.get('nf2-pos-' + f));
}

function applyView(keepKey){
  const term = el.search.value.trim().toLowerCase(), mode = el.mode.value;
  view = all.filter(c => {
    const s = progress[c.q];
    if (mode === 'unknown' && s !== 'unknown') return false;
    if (mode === 'new' && s) return false;
    return !term || c.q.toLowerCase().includes(term) || c.a.toLowerCase().includes(term);
  });
  if (shuffled) shuffleArray(view);
  const i = keepKey ? view.findIndex(c => c.q === keepKey) : -1;
  idx = i >= 0 ? i : 0;
  setFlip(false); render();
}

function setFlip(v){ flipped = v; el.card.classList.toggle('flipped', v); }

function render(){
  const c = view[idx], has = !!c;
  [el.prev,el.next,el.known,el.unknown,el.speak].forEach(b => b.disabled = !has);
  if (has) {
    el.q.textContent = c.q; el.a.textContent = c.a;
    store.set('nf2-pos-' + file, c.q);
  } else if (all.length) {
    el.q.textContent = el.mode.value === 'unknown' ? 'No cards marked "still learning" yet.' : 'No cards match your filters.';
    el.a.textContent = '';
  }
  const st = has ? progress[c.q] : '';
  document.querySelectorAll('.state').forEach(s => {
    s.dataset.s = st || ''; s.textContent = st === 'known' ? 'Known' : st === 'unknown' ? 'Still learning' : '';
  });
  el.count.textContent = has ? `${idx + 1} / ${view.length}` : '0 / 0';
  stats();
}

function stats(){
  const total = all.length;
  const k = all.filter(c => progress[c.q] === 'known').length;
  const u = all.filter(c => progress[c.q] === 'unknown').length;
  el.nK.textContent = k; el.nU.textContent = u; el.nT.textContent = total;
  el.barK.style.width = total ? k / total * 100 + '%' : '0';
  el.barU.style.width = total ? u / total * 100 + '%' : '0';
  el.bar.setAttribute('aria-valuenow', total ? Math.round(k / total * 100) : 0);
}

// Flip back first so the next answer never flashes while the card turns.
function go(n){
  if (!view.length) return;
  const t = (n + view.length) % view.length;
  const apply = () => { idx = t; render(); };
  clearTimeout(timer);
  if (flipped) { setFlip(false); timer = setTimeout(apply, 230); } else apply();
}

function mark(s){
  const c = view[idx]; if (!c) return;
  progress[c.q] = s;
  store.set('nf2-progress-' + file, JSON.stringify(progress));
  stats();
  view.length > 1 ? go(idx + 1) : render();
}

function speak(){
  const c = view[idx]; if (!c || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(flipped ? c.a : c.q);
  u.lang = 'nb-NO';
  const v = speechSynthesis.getVoices().find(v => /^(nb|no|nn)/i.test(v.lang));
  if (v) u.voice = v;
  el.voice.textContent = v ? `Voice: ${v.name} (${v.lang})` : 'No Norwegian voice installed. Using the browser default.';
  speechSynthesis.speak(u);
}
if (!('speechSynthesis' in window)) el.speak.hidden = true; else speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

el.card.addEventListener('click', () => setFlip(!flipped));
el.prev.onclick = () => go(idx - 1);
el.next.onclick = () => go(idx + 1);
el.known.onclick = () => mark('known');
el.unknown.onclick = () => mark('unknown');
el.speak.onclick = speak;
// Every press reshuffles and starts from the first card of the new order.
el.shuffle.onclick = () => {
  shuffled = true; syncShuffleUI();
  applyView(null);
};
$('ordered').onclick = () => {
  shuffled = false; syncShuffleUI();
  applyView(view[idx] && view[idx].q);
};
function syncShuffleUI(){
  el.shuffle.setAttribute('aria-pressed', shuffled);
  el.shuffle.textContent = shuffled ? '🔀 Reshuffle' : '🔀 Shuffle';
  $('ordered').hidden = !shuffled;
}
el.reset.onclick = () => {
  if (!all.length || !confirm('Reset all progress for this set?')) return;
  progress = {}; store.set('nf2-progress-' + file, '{}');
  applyView(view[idx] && view[idx].q);
};
el.search.addEventListener('input', () => applyView());
el.mode.addEventListener('change', () => applyView());
el.set.addEventListener('change', () => { el.search.value = ''; loadSet(el.set.value); });

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  const key = e.key.toLowerCase();
  if ((key === ' ' || key === 'enter') && tag !== 'BUTTON' && tag !== 'A') { e.preventDefault(); setFlip(!flipped); }
  else if (key === 'arrowright') go(idx + 1);
  else if (key === 'arrowleft') go(idx - 1);
  else if (key === 'k') mark('known');
  else if (key === 'u') mark('unknown');
  else if (key === 's') speak();
  else if (key === '/') { e.preventDefault(); el.search.focus(); }
});

const last = store.get('lastSet');
el.set.value = SETS.includes(last) ? last : SETS[0];
loadSet(el.set.value);
</script>
</body>
</html>
